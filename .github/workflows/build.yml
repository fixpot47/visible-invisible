name: Build VisibleInvisible
on:
  push:
    branches: [main, feature/visibleinvisible-0.1.0]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Build mod
        run: gradle --no-daemon build
      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VisibleInvisible-0.1.0-Minecraft-26.2
          path: build/libs/visibleinvisible-*.jar
          if-no-files-found: error
